[advisories]
# cargo-deny 0.16+ removed per-severity controls (vulnerability/notice now
# default to deny) and re-added `unmaintained` with scope values only.
# "workspace" is the closest to the old warn: transitive unmaintained crates
# are tolerated, direct dependencies fail.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# CDLA-Permissive-2.0 (webpki-roots, rustls stack), Unicode-3.0 (icu/idna chain
# via url, also covers unicode-ident's "(MIT OR Apache-2.0) AND Unicode-3.0"),
# and Zlib (foldhash via sqlx-core) are all OSI-approved.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "CDLA-Permissive-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
