# Add your own age public key (age-keygen) to encrypt secrets for yourself.
# The matching private key lives at ~/.config/sops/age/keys.txt and never leaves
# your machine — keep it out of this repository.
#
# Note: on Windows sops evaluates path_regex relative to this config file, so
# the optional `secrets/` prefix keeps matching working across platforms.
creation_rules:
  - path_regex: '(secrets[/\\])?.*\.enc\.yaml$'
    age: age1ua7unl6ad4095kcgvq365v056kjh0e52cx2mpm7kqh9xu0ejhe4q3yagpq